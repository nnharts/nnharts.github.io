</head>
<body>
<p>Открываю случайный род&hellip;</p>
<p><a href="/golubevskaya/rody/">Перейти к справочнику родов</a></p>
<script>
(() => {
  const blocked = new Set(['архипов', 'синицын']);
  const translit = {
    а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',
    к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',
    х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'
  };
  const slug = name => [...name.toLowerCase()]
    .map(ch => translit[ch] ?? ch).join('')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

  fetch('/golubevskaya/rody/rody-data.json', {cache:'no-store'})
    .then(response => {
      if (!response.ok) throw new Error('Не удалось загрузить список родов');
      return response.json();
    })
    .then(data => {
      const clans = Object.keys(data.fam || {}).filter(name => !blocked.has(name));
      if (!clans.length) throw new Error('Список родов пуст');
      const clan = clans[Math.floor(Math.random() * clans.length)];
      location.replace('/golubevskaya/rody/#rod:' + slug(clan));
    })
    .catch(() => location.replace('/golubevskaya/rody/'));
})();
</script>
</body>
</html>
